name: "Templates"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
    - master

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  templates:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
      with:
        nix_version: "2.31.2"
        nix_conf: |
          accept-flake-config = true
          fallback = true
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
          keep-env-derivations = true
          keep-outputs = true

    - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
      continue-on-error: true
      with:
        name: data-cartel-public
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: nix-${{ runner.os }}-templates-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-templates-
        gc-max-store-size-linux: 5G

    - name: Test rust template
      run: |
        tmp=$(mktemp -d)
        cd "$tmp"
        nix flake init -t "${GITHUB_WORKSPACE}#rust" --accept-flake-config
        test -f Cargo.toml
        test -f flake.nix
        test -f rust.nix
        test -f src/main.rs
        test -f AGENTS.md
        test -f clippy.toml
        test -L CLAUDE.md
        nix develop --impure --accept-flake-config -c rustc --version

    - name: Test ci template
      run: |
        tmp=$(mktemp -d)
        cd "$tmp"
        nix flake init -t "${GITHUB_WORKSPACE}#ci" --accept-flake-config
        test -f .github/workflows/ci.yaml

    - name: Test nix template
      run: |
        tmp=$(mktemp -d)
        cd "$tmp"
        nix flake init -t "${GITHUB_WORKSPACE}#nix" --accept-flake-config
        test -f flake.nix
        test -f .envrc
        nix develop --impure --accept-flake-config \
          --override-input rust-nix "${GITHUB_WORKSPACE}" \
          -c rustc --version
